<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habi — RankMascot Preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0B1410;
  color: #fff;
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 36px 16px 48px;
  min-height: 100vh;
}
.wordmark { font-size: 24px; font-weight: 800; color: #4ADE80; letter-spacing: 1px; margin-bottom: 4px; }
.subtitle { font-size: 12px; color: #4B6D54; letter-spacing: 0.5px; margin-bottom: 44px; }

/* Stage */
.stage { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 40px; }
.stage-name { font-size: 30px; font-weight: 800; letter-spacing: 0.3px; transition: color 0.3s; }
.stage-desc { font-size: 11px; color: #4B6D54; text-transform: uppercase; letter-spacing: 2px; }
.stage-stars { font-size: 12px; color: #F4C842; margin-top: 2px; }

.mascot-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
.glow {
  position: absolute; width: 200px; height: 200px; border-radius: 50%;
  filter: blur(55px); opacity: 0.28; pointer-events: none; transition: background 0.4s;
}
.main-svg { display: block; overflow: visible; }

.btn-row { display: flex; gap: 10px; margin-top: 4px; }
.btn {
  padding: 11px 30px; border-radius: 22px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 700; letter-spacing: 0.4px;
  transition: transform 0.1s, opacity 0.1s, background 0.3s;
}
.btn:hover { transform: scale(1.05); }
.btn:active { opacity: 0.8; transform: scale(0.98); }
.btn-primary { background: #4ADE80; color: #0B1410; }
.btn-secondary {
  background: transparent; color: #4B6D54;
  border: 1.5px solid #1F3028; font-weight: 600;
}
.btn-secondary:hover { color: #9CA3AF; border-color: #2D4A38; }

/* Tier row */
.tier-row {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 28px;
}
.tier-pill {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  cursor: pointer; padding: 10px 8px 8px; border-radius: 14px;
  border: 2px solid transparent; background: #121E17;
  transition: border-color 0.2s, background 0.2s;
  min-width: 70px;
}
.tier-pill:hover { background: #192618; }
.tier-pill.active { background: #162117; border-color: var(--tc); }
.tier-pill-svg { overflow: visible; }
.tier-pill-name { font-size: 10px; font-weight: 700; color: #5A7A63; transition: color 0.2s; }
.tier-pill.active .tier-pill-name { color: var(--tc); }
.tier-num { font-size: 9px; color: #2D4A38; }

/* Anim speed label */
.footer { font-size: 11px; color: #2D4A38; text-align: center; line-height: 1.8; }
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 8px;
  background: #162117; font-size: 10px; color: #4B6D54; margin-left: 6px;
}

/* reduce-motion off by default = animations always on */
@media (prefers-reduced-motion: reduce) {
  .glow { display: none; }
}
</style>
</head>
<body>

<div class="wordmark">Habi</div>
<div class="subtitle">RankMascot · all 7 tiers · live animation</div>

<div class="stage">
  <div id="stage-name" class="stage-name">Delulu</div>
  <div id="stage-desc" class="stage-desc">noodle mode</div>
  <div id="stage-stars" class="stage-stars">★ 5 stars to unlock</div>

  <div class="mascot-wrap">
    <div id="glow" class="glow"></div>
    <svg id="main-svg" class="main-svg" width="210" height="230"
         viewBox="-65 -85 130 160" style="overflow:visible">
      <g id="main-g"></g>
    </svg>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="btn-levelup" onclick="triggerLevelUp()">⬆ Level Up!</button>
    <button class="btn btn-secondary" onclick="randomTier()">Shuffle</button>
  </div>
</div>

<div class="tier-row" id="tier-row"></div>

<div class="footer">
  Click any rank to switch &nbsp;·&nbsp; Level Up fires the pop + haptic sequence
  <span class="badge">skewX skipped — matches React Native native driver</span>
</div>

<script>
/* ─── data ─── */
const STAR = "0,-22 5.41,-7.44 20.92,-6.8 8.75,2.84 12.93,17.8 0,9.2 -12.93,17.8 -8.75,2.84 -20.92,-6.8 -5.41,-7.44";

const RANKS = [
  {
    tier:0, name:'Delulu', stars:5, descriptor:'noodle mode',
    color:'#A78BFA', edge:'#7C5CE0',
    limbs:['M-9,-8 Q-26,-4 -28,-22','M9,-8 Q26,-4 30,-20','M-6,14 Q-18,26 -22,18','M6,14 Q18,28 24,20'],
    face:[
      {t:'path',d:'M-10,-7 q3,4 6,0',stroke:'#2A2A2A',sw:2,cap:'round'},
      {t:'path',d:'M2,-7 q3,4 6,0',stroke:'#2A2A2A',sw:2,cap:'round'},
      {t:'ellipse',cx:0,cy:3,rx:4,ry:5,fill:'#2A2A2A'},
    ],
    anim:{duration:1400,loop:true,ch:{
      rotate:[[0,-18],[.25,14],[.5,-10],[.75,16],[1,-18]],
      scaleY:[[0,1],[.25,.85],[.5,1.15],[.75,1],[1,1]],
    }},
  },
  {
    tier:1, name:'Mewing', stars:10, descriptor:'max send',
    color:'#818CF8', edge:'#5B61D6',
    limbs:['M-13,12 Q-20,20 -14,24','M13,12 Q20,20 14,24','M-12,0 L-20,-4','M12,0 L20,-4'],
    face:[
      {t:'path',d:'M-9,-7 L-3,-5',stroke:'#2A2A2A',sw:2,cap:'round'},
      {t:'path',d:'M9,-7 L3,-5',stroke:'#2A2A2A',sw:2,cap:'round'},
      {t:'circle',cx:0,cy:2,r:3,fill:'#2A2A2A'},
    ],
    anim:{duration:2000,loop:true,ch:{
      translateY:[[0,0],[.5,4],[.62,-34],[.8,0],[1,0]],
      scaleY:    [[0,1],[.5,.6],[.62,1.4],[.8,.9],[1,1]],
      scaleX:    [[0,1],[.5,1.3],[.62,.7],[.8,1.1],[1,1]],
    }},
  },
  {
    tier:2, name:'Rizz', stars:20, descriptor:'hit the griddy',
    color:'#60A5FA', edge:'#3B82F6',
    limbs:['M-6,15 L-16,32','M6,15 L16,30','M-13,1 Q-24,-6 -28,-14','M13,-1 Q24,-8 28,-16'],
    face:[
      {t:'circle',cx:-7,cy:-8,r:2.2,fill:'#2A2A2A'},
      {t:'path',d:'M4,-8 h6',stroke:'#2A2A2A',sw:2,cap:'round'},
      {t:'path',d:'M-5,-1 q6,4 11,-2',stroke:'#2A2A2A',sw:2,cap:'round'},
    ],
    anim:{duration:550,loop:true,ch:{
      rotate:    [[0,-7],[1,7]],
      translateX:[[0,-3],[1,3]],
    }},
  },
  {
    tier:3, name:'Gigachad', stars:40, descriptor:'too swole',
    color:'#2DD4BF', edge:'#14B8A6',
    limbs:['M-7,15 L-19,33','M7,15 L19,33','M-12,-4 Q-26,-6 -22,-20','M12,-4 Q26,-6 22,-20'],
    face:[
      {t:'circle',cx:-23,cy:-19,r:6,fill:'#14B8A6'},
      {t:'circle',cx:23,cy:-19,r:6,fill:'#14B8A6'},
      {t:'path',d:'M-10,-9 l5,3 l-5,3',stroke:'#2A2A2A',sw:2,cap:'round'},
      {t:'path',d:'M10,-9 l-5,3 l5,3',stroke:'#2A2A2A',sw:2,cap:'round'},
      {t:'path',d:'M-6,2 q6,4 12,0',stroke:'#2A2A2A',sw:2.5,cap:'round'},
    ],
    anim:{duration:1600,loop:true,ch:{
      scaleX:[[0,1],[.35,1.05],[.55,1.45],[.7,1.5],[.85,.92],[1,1]],
      scaleY:[[0,1],[.35,1.05],[.55,1.3],[.7,1.32],[.85,.92],[1,1]],
    }},
  },
  {
    tier:4, name:'Aura Farmer', stars:80, descriptor:'spin to win',
    color:'#F472B6', edge:'#EC4899',
    limbs:['M-6,14 Q-16,22 -12,30','M6,14 Q16,22 12,30','M-12,1 L-24,-6','M12,1 L24,-6'],
    face:[
      {t:'circle',cx:-6,cy:-6,r:2,fill:'#2A2A2A'},
      {t:'circle',cx:6,cy:-6,r:2,fill:'#2A2A2A'},
      {t:'path',d:'M-6,1 q6,5 12,0',stroke:'#2A2A2A',sw:2,cap:'round'},
    ],
    anim:{duration:1300,loop:true,ch:{
      rotate:[[0,0],[.45,180],[.55,200],[1,360]],
      scaleX:[[0,1],[.45,.7],[.55,.7],[1,1]],
    }},
  },
  {
    tier:5, name:'Main Character', stars:160, descriptor:'hair flip',
    color:'#FB923C', edge:'#EA7317',
    limbs:['M2,15 L13,38','M-2,15 L-16,40','M11,0 Q24,-2 26,-14','M-12,0 Q-22,4 -26,-6'],
    face:[
      {t:'rect',x:-13,y:-10,width:11,height:6,fill:'#2A2A2A'},
      {t:'rect',x:2,y:-10,width:11,height:6,fill:'#2A2A2A'},
      {t:'line',x1:-2,y1:-7.5,x2:2,y2:-7.5,stroke:'#2A2A2A',sw:2},
      {t:'path',d:'M-4,2 q5,3 9,-1',stroke:'#2A2A2A',sw:2,cap:'round'},
    ],
    anim:{duration:1800,loop:true,ch:{
      rotate:    [[0,0],[.2,-4],[.4,28],[.55,30],[.75,-6],[1,0]],
      translateX:[[0,0],[.4,8],[.55,8],[.75,0],[1,0]],
    }},
  },
  {
    tier:6, name:'GOATED', stars:320, descriptor:'infinite W',
    color:'#F4C842', edge:'#A87B12',
    limbs:['M-6,14 Q-18,18 -14,28','M6,14 Q18,18 14,28','M-12,-4 L-26,-16','M12,-4 L26,-16'],
    face:[
      {t:'path',d:'M-12,-23 L-12,-33 L-4,-27 L0,-36 L4,-27 L12,-33 L12,-23 Z',fill:'#FFE066',stroke:'#A87B12',sw:1.5},
      {t:'circle',cx:-6,cy:-6,r:2.2,fill:'#2A2A2A'},
      {t:'circle',cx:6,cy:-6,r:2.2,fill:'#2A2A2A'},
      {t:'path',d:'M-7,-1 q7,7 14,0',stroke:'#2A2A2A',sw:2,cap:'round'},
    ],
    anim:{duration:1500,loop:true,ch:{
      translateY:[[0,3],[.2,8],[.45,-22],[.7,-4],[.85,4],[1,3]],
      rotate:    [[0,0],[.45,-200],[.7,-360],[1,-360]],
      scaleY:    [[0,1],[.2,.85],[.85,.92],[1,1]],
    }},
  },
];

/* ─── interpolation ─── */
function interp(p, arr, dflt) {
  if (!arr || arr.length < 2) return dflt;
  if (p <= arr[0][0]) return arr[0][1];
  if (p >= arr[arr.length-1][0]) return arr[arr.length-1][1];
  for (let i = 0; i < arr.length - 1; i++) {
    if (p >= arr[i][0] && p <= arr[i+1][0]) {
      const t = (p - arr[i][0]) / (arr[i+1][0] - arr[i][0]);
      return arr[i][1] + t * (arr[i+1][1] - arr[i][1]);
    }
  }
  return dflt;
}

function buildTransform(ch, p, popSc) {
  const tx = interp(p, ch.translateX, 0);
  const ty = interp(p, ch.translateY, 0);
  const r  = interp(p, ch.rotate, 0);
  const s  = interp(p, ch.scale, 1) * (popSc || 1);
  const sx = interp(p, ch.scaleX, 1) * s;
  const sy = interp(p, ch.scaleY, 1) * s;
  // skewX intentionally skipped — matches RN native driver behavior
  return `translate(${tx.toFixed(3)},${ty.toFixed(3)}) rotate(${r.toFixed(3)}) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
}

/* ─── SVG building ─── */
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function buildMascot(rank, g) {
  while (g.firstChild) g.removeChild(g.firstChild);

  // limbs (behind body)
  for (const d of rank.limbs) {
    g.appendChild(el('path', {
      d, fill: 'none', stroke: rank.edge,
      'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'
    }));
  }

  // star body
  g.appendChild(el('polygon', {
    points: STAR, fill: rank.color, stroke: rank.edge, 'stroke-width': 2,
  }));

  // face
  for (const f of rank.face) {
    const fill = f.fill ?? 'none';
    const attrs = { fill };
    if (f.stroke) {
      attrs.stroke = f.stroke;
      attrs['stroke-width'] = f.sw ?? 2;
      attrs['stroke-linecap'] = f.cap ?? 'round';
      attrs['stroke-linejoin'] = 'round';
    }
    switch (f.t) {
      case 'path':    g.appendChild(el('path',    {...attrs, d: f.d})); break;
      case 'circle':  g.appendChild(el('circle',  {...attrs, cx: f.cx, cy: f.cy, r: f.r})); break;
      case 'ellipse': g.appendChild(el('ellipse', {...attrs, cx: f.cx, cy: f.cy, rx: f.rx, ry: f.ry})); break;
      case 'rect':    g.appendChild(el('rect',    {...attrs, x: f.x, y: f.y, width: f.width, height: f.height})); break;
      case 'line':    g.appendChild(el('line',    {...attrs, x1: f.x1, y1: f.y1, x2: f.x2, y2: f.y2})); break;
      case 'polygon': g.appendChild(el('polygon', {...attrs, points: f.points})); break;
    }
  }
}

/* ─── state ─── */
let sel = 0;
let mainStart = performance.now();
const smallStart = RANKS.map(r => performance.now() - Math.random() * r.anim.duration);

// pop
let popScale = 1;
let popT0 = 0;
let popPhase = 0; // 0=idle 1=up 2=down

function triggerLevelUp() {
  popPhase = 1; popT0 = performance.now(); popScale = 1;
}
function randomTier() { selectTier((sel + 1 + Math.floor(Math.random() * (RANKS.length - 1))) % RANKS.length); }

/* ─── tier row ─── */
function buildTierRow() {
  const row = document.getElementById('tier-row');
  for (const rank of RANKS) {
    const pill = document.createElement('div');
    pill.className = 'tier-pill' + (rank.tier === sel ? ' active' : '');
    pill.style.setProperty('--tc', rank.color);
    pill.dataset.t = rank.tier;
    pill.onclick = () => selectTier(rank.tier);

    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', '54');
    svg.setAttribute('height', '58');
    svg.setAttribute('viewBox', '-34 -44 68 72');
    svg.style.overflow = 'visible';
    svg.className = 'tier-pill-svg';

    const g = document.createElementNS(NS, 'g');
    g.id = `sg-${rank.tier}`;
    svg.appendChild(g);

    const name = document.createElement('div');
    name.className = 'tier-pill-name';
    name.textContent = rank.name;

    const num = document.createElement('div');
    num.className = 'tier-num';
    num.textContent = `T${rank.tier}`;

    pill.appendChild(svg);
    pill.appendChild(name);
    pill.appendChild(num);
    row.appendChild(pill);

    buildMascot(rank, g);
  }
}

function selectTier(t) {
  sel = t;
  mainStart = performance.now();
  popPhase = 0; popScale = 1;

  const rank = RANKS[t];
  document.getElementById('stage-name').textContent = rank.name;
  document.getElementById('stage-name').style.color = rank.color;
  document.getElementById('stage-desc').textContent = rank.descriptor;
  document.getElementById('stage-stars').textContent = `★ ${rank.stars} stars to unlock`;
  document.getElementById('glow').style.background = rank.color;

  const btnLvl = document.getElementById('btn-levelup');
  btnLvl.style.background = rank.color;
  btnLvl.style.color = t === 6 ? '#0B1410' : '#0B1410'; // all dark bg text

  document.querySelectorAll('.tier-pill').forEach(p => {
    const active = parseInt(p.dataset.t) === t;
    p.classList.toggle('active', active);
    p.style.setProperty('--tc', rank.color);
  });

  buildMascot(rank, document.getElementById('main-g'));
}

/* ─── RAF loop ─── */
function tick() {
  const now = performance.now();

  // pop calc
  if (popPhase === 1) {
    const t = Math.min((now - popT0) / 160, 1);
    popScale = 1 + 0.18 * (1 - Math.pow(1 - t, 3));
    if (t >= 1) { popPhase = 2; popT0 = now; }
  } else if (popPhase === 2) {
    const t = Math.min((now - popT0) / 280, 1);
    popScale = 1.18 - 0.18 * (1 - Math.pow(1 - t, 2));
    if (t >= 1) { popPhase = 0; popScale = 1; }
  }

  // main
  const r = RANKS[sel];
  if (r.anim.loop) {
    const p = ((now - mainStart) % r.anim.duration) / r.anim.duration;
    const mg = document.getElementById('main-g');
    if (mg) mg.setAttribute('transform', buildTransform(r.anim.ch, p, popScale));
  }

  // small
  for (const rank of RANKS) {
    const sg = document.getElementById(`sg-${rank.tier}`);
    if (!sg || !rank.anim.loop) continue;
    const p = ((now - smallStart[rank.tier]) % rank.anim.duration) / rank.anim.duration;
    sg.setAttribute('transform', buildTransform(rank.anim.ch, Math.max(0, p), 1));
  }

  requestAnimationFrame(tick);
}

/* ─── init ─── */
buildTierRow();
selectTier(0);
requestAnimationFrame(tick);
</script>
</body>
</html>
